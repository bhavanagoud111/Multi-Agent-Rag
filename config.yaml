# Describe what you indexed — used in router and answer prompts (any report/PDF use case).
document:
  title: "Google 2024 Environmental Report"
  scope: "information that appears in the uploaded PDF you indexed (e.g. annual report, policy, handbook, or technical document)."

retriever:
  # Path to the PDF to index (relative to project root is fine). The repo ships
  # this sample report; replace it with any PDF and update `document` above.
  file: "retriever/google-2024-environmental-report.pdf"
  headers_to_split_on:
    - ["#", "Header 1"]
    - ["##", "Header 2"]
  load_documents: false
  collection_name: rag-chroma-documents
  directory: vector_db
  top_k: 3
  top_k_compression: 3
  ensemble_weights: [0.3, 0.3, 0.4]
  cohere_rerank_model: rerank-english-v3.0
llm:
  gpt_4o_mini: gpt-4o-mini-2024-07-18
  gpt_4o: gpt-4o-2024-08-06
  temperature: 0
